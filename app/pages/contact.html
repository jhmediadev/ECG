<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse Construction Group</title>
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="../assets/styles/normalize.css" />
  <link rel="stylesheet" href="../assets/styles/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous" />
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
  <main>
    <main-header></main-header>
    <div class="main-container contact-container">
      <div class="main-header margin-bottom">
        <h1 class="container-main ">CONTACT US</h1>
        <!-- <hr style="border-color: dodgerblue; margin-left: -5px" /> -->
      </div>
      <div>


        <section class="contact-section">
          <div class="contact-card">
            <div class="contact-card-center item-stack">
              <h1 class="contact-title">We Can Help </h1>
              <p class="paragraph">
                Send us a message and receive a bid or assistance with starting a new project.
              </p>
              <img src="../images/contact-bkgd.png" alt="blueprint background" class="contact-img">
              <form action="#" class="contact-form">
                <label class="margin-top-small label" for="firstName">First Name</label>
                <input class="input" type="text" name="firstName" required>

                <label class="margin-top-small label" for="lastName">Last Name</label>
                <input class="input" type="text" name="lastName" required>

                <label class="margin-top-small label" for="email">Email</label>
                <input class="input" type="email" name="email" required>

                <label class="margin-top-small label" for="message">Your Message</label>
                <textarea class="textarea " placeholder="Tell us something about your project." name="message" rows="4"
                  cols="3" maxlength="1000" resize="none" required></textarea>

                <label class="margin-top-small label" for="calendar">Approximate Project Start
                  Date</label>
                <input class="input" class="margin-bottom-small" type="date" name="calendar">

                <button class="large-button margin-bottom margin-top-small">
                  <a href="#">SUBMIT</a>
                </button>
                <p class="margin-top-small">Please allow 1 to 2 days for a response.</p>
                <a class="privacy-policy" href="../../pages/privacy.html">Your Privacy</a>
              </form>
            </div>
          </div>
          <div>
            <img class="contact-img-headqtrs" src="../images/Headquarters.png" alt="">
          </div>
        </section>
        <div class="contact-address-headqtrs">
          <h2>Our Address</h2>
          <p class="">1801 Cook Avenue <br>
            Orlando, FL 32806</p>
          <div class="">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d2478.8182079764347!2d-81.37775770123375!3d28.522331771800665!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88e77b0c18f7090b%3A0x368aa0cbc17b73b7!2s1801%20Cook%20Ave%2C%20Orlando%2C%20FL%2032806!5e0!3m2!1sen!2sus!4v1744135228292!5m2!1sen!2sus"
              class="map" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="container-center contact-phone-email ">
            <div>
              <h2>Call Us</h2>
              <p>407-555-5555</p>
            </div>
            <br>
            <div>
              <h2>Email Us</h2>
              <p>
                <a href="mailto:eclipseconstruction@mail.com">eclipseconstruction@mail.com</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button id="myBtn" title="Go to top">TOP</button>
    <main-footer></main-footer>
  </main>
  </div>
  <script src="../bundled.js" defer></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>

</html>
